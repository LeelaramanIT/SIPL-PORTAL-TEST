<title>Order Routes</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,400..800&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: three panes — workflow list + status library | vertical stage timeline (the order's journey, top to bottom) | live inspector for the selected item */
:root{
  --bg:#eef2f0; --panel:#ffffff; --panel-2:#f5f8f6; --ink:#13231f; --muted:#5a6a66; --line:#d8e0dc;
  --accent:#0f6e5c; --accent-ink:#ffffff; --accent-soft:#dcefe9; --rail:#b9c8c2;
  --waypoint:#6a3fb5; --waypoint-soft:#ece5f8; --task:#1f6fd1; --task-soft:#e1ecfb;
  --approval:#b9480f; --approval-soft:#fbe8dc; --danger:#c02d2d; --danger-soft:#fbe3e3; --warn:#a86400;
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-ui:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1513; --panel:#16201d; --panel-2:#1c2824; --ink:#e3ece8; --muted:#93a59f; --line:#2a3833;
  --accent:#4cc3a6; --accent-ink:#07130f; --accent-soft:#173a32; --rail:#34463f;
  --waypoint:#b593f0; --waypoint-soft:#2a2140; --task:#6aa8ff; --task-soft:#1a2b45;
  --approval:#f08a4b; --approval-soft:#3a2416; --danger:#ff7070; --danger-soft:#3d1c1c; --warn:#e8a63c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1513; --panel:#16201d; --panel-2:#1c2824; --ink:#e3ece8; --muted:#93a59f; --line:#2a3833;
  --accent:#4cc3a6; --accent-ink:#07130f; --accent-soft:#173a32; --rail:#34463f;
  --waypoint:#b593f0; --waypoint-soft:#2a2140; --task:#6aa8ff; --task-soft:#1a2b45;
  --approval:#f08a4b; --approval-soft:#3a2416; --danger:#ff7070; --danger-soft:#3d1c1c; --warn:#e8a63c; color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num-t{font-variant-numeric:tabular-nums}

.shell{height:100%;display:grid;grid-template-columns:250px minmax(0,1fr) 390px;gap:14px;min-height:0}

/* left rail */
.rail{display:flex;flex-direction:column;gap:16px;min-height:0}
.brand{font-family:var(--f-display);font-stretch:80%;font-weight:800;font-size:20px;letter-spacing:.01em;line-height:1}
.brand small{display:block;font-family:var(--f-ui);font-stretch:100%;font-weight:500;font-size:12px;color:var(--muted);letter-spacing:0;margin-top:4px}
.lbl{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0}
.wflist{display:flex;flex-direction:column;gap:2px}
.wfitem{display:flex;flex-direction:column;gap:1px;padding:8px 10px;border-radius:8px;border:0;background:none;text-align:left;width:100%}
.wfitem:hover{background:var(--panel)}
.wfitem.on{background:var(--panel);box-shadow:inset 3px 0 0 var(--accent)}
.wfitem b{font-weight:600;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wfitem small{color:var(--muted);font-size:11.5px}
.linkbtn{background:none;border:0;color:var(--accent);padding:4px 10px;font-size:13px;font-weight:600;text-align:left}
.lib{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 0 0;overflow:hidden}
.lib .hd{padding:0 12px;display:flex;flex-direction:column;gap:6px}
.lib .hd p{margin:0;font-size:12px;color:var(--muted)}
.mlist{overflow:auto;padding:0 6px 10px;flex:1;min-height:0}
.mcat{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:10px 6px 3px;font-weight:600;display:flex;justify-content:space-between}
.mitem{display:grid;grid-template-columns:26px 1fr auto;gap:6px;align-items:center;padding:5px 6px;border-radius:6px;font-size:12px;width:100%;background:none;border:0;text-align:left;cursor:grab}
.mitem:hover{background:var(--panel-2)}
.mitem .id{font-family:var(--f-mono);font-size:10.5px;color:var(--muted)}
.mitem.used{color:var(--muted)}
.mitem .tag{font-size:10px;color:var(--accent);font-weight:700}

input[type=search],input[type=text],input[type=number],select{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:7px 9px;font-size:13px;width:100%;min-width:0}
input:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

/* center */
.flow{min-height:0;min-width:0;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px}
.flow-in{padding:20px 24px 40px;display:flex;flex-direction:column;gap:18px;max-width:880px}
.top{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.top .name{flex:1 1 260px;font-family:var(--f-display);font-stretch:85%;font-weight:750;font-size:26px;border:0;border-bottom:1px dashed transparent;border-radius:0;padding:2px 0;background:none}
.top .name:hover{border-bottom-color:var(--line)}
.top .name:focus{box-shadow:none;border-bottom-color:var(--accent)}
.top select{width:auto}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:7px 12px;font-size:13px;font-weight:600;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--danger);background:none;border-color:transparent}
.btn.danger:hover{border-color:var(--danger)}
.btn.ghost{border-color:transparent;background:none;color:var(--accent)}

.stats{display:flex;flex-wrap:wrap;gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stat{flex:1 1 120px;padding:10px 14px;border-right:1px solid var(--line);min-width:0}
.stat:last-child{border-right:0}
.stat span{display:block;font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.stat b{font-family:var(--f-display);font-stretch:85%;font-size:21px;font-weight:700;font-variant-numeric:tabular-nums}
.stat b small{font-family:var(--f-ui);font-size:12px;font-weight:500;color:var(--muted);margin-left:4px}
.stat.warn b{color:var(--warn)}

/* start rules card */
.rules{border:1.5px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;background:var(--panel-2);cursor:pointer;position:relative}
.rules:hover{border-color:var(--accent)}
.rules.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.rh{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.startbadge{font-family:var(--f-display);font-stretch:80%;font-weight:800;font-size:13px;letter-spacing:.08em;text-transform:uppercase;background:var(--accent);color:var(--accent-ink);padding:4px 10px;border-radius:5px}
.rh p{margin:0;flex:1;min-width:200px}
.mm{border:0;border-bottom:1.5px dotted var(--accent);background:none;color:var(--accent);font-weight:700;padding:0 1px}
.toks{display:flex;flex-wrap:wrap;gap:6px}
.tok{display:inline-flex;gap:5px;align-items:baseline;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:5px 9px;font-size:12.5px;max-width:100%}
.tok span{color:var(--muted)}
.tok b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tok.add{border-style:dashed;color:var(--accent);font-weight:600}
.toks .empty{margin:0;color:var(--muted);font-size:13px}

/* timeline */
.timeline{list-style:none;margin:0;padding:0;position:relative}
.timeline::before{content:"";position:absolute;left:19px;top:6px;bottom:6px;width:2px;background:var(--rail)}
.phase{position:relative;padding-bottom:6px}
.phd{display:flex;align-items:center;gap:10px;padding:14px 0 6px 0;position:relative}
.phd::before{content:"";width:12px;height:12px;margin-left:14px;transform:rotate(45deg);background:var(--panel);border:2px solid var(--ink);flex:none;position:relative;z-index:1}
.phd h3{margin:0 0 0 10px;font-family:var(--f-display);font-stretch:80%;font-weight:750;font-size:15px;letter-spacing:.07em;text-transform:uppercase}
.phd span{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.steps{list-style:none;margin:0;padding:0}
.step{display:grid;grid-template-columns:40px minmax(0,1fr) auto auto;gap:12px;align-items:start;padding:10px 10px 10px 0;border-radius:10px;border:1px solid transparent;cursor:pointer;position:relative}
.step:hover{background:var(--panel-2)}
.step.sel{background:var(--accent-soft);border-color:var(--accent)}
.step.drop-before{box-shadow:inset 0 3px 0 var(--accent)}
.step.drop-after{box-shadow:inset 0 -3px 0 var(--accent)}
.num{width:30px;height:30px;margin-left:5px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-size:11.5px;font-weight:500;background:var(--panel);border:2px solid currentColor;position:relative;z-index:1}
.k-waypoint .num{color:var(--waypoint)} .k-task .num{color:var(--task)} .k-approval .num{color:var(--approval);border-radius:7px;transform:rotate(45deg)}
.k-approval .num i{transform:rotate(-45deg);font-style:normal}
.sb{min-width:0;display:flex;flex-direction:column;gap:4px}
.ttl{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;font-weight:600;font-size:14.5px}
.ttl .sid{font-family:var(--f-mono);font-size:11px;color:var(--muted);font-weight:400}
.step.warn .ttl > span:first-child{color:var(--warn)}
.meta{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;color:var(--muted);align-items:center}
.kpill{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:4px}
.k-waypoint .kpill{background:var(--waypoint-soft);color:var(--waypoint)}
.k-task .kpill{background:var(--task-soft);color:var(--task)}
.k-approval .kpill{background:var(--approval-soft);color:var(--approval)}
.branch{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;font-size:12px;margin-top:2px;padding:6px 8px;border-radius:7px;background:var(--danger-soft);border:1px dashed color-mix(in srgb,var(--danger) 45%,transparent)}
.branch .bl{font-weight:700;color:var(--danger)}
.branch .bchip{background:var(--panel);border-radius:4px;padding:1px 6px}
.branch .bchip i{font-style:normal;font-family:var(--f-mono);font-size:10.5px;color:var(--muted);margin-right:4px}
.branch .arr{color:var(--danger)}
.branch .bret{font-style:italic;color:var(--muted)}
.sla{font-family:var(--f-mono);font-size:12px;color:var(--muted);padding-top:3px;white-space:nowrap;text-align:right;min-width:52px}
.ops{display:flex;gap:2px;opacity:0;transition:opacity .12s}
.step:hover .ops,.step.sel .ops,.step:focus-within .ops{opacity:1}
.ops button{border:1px solid var(--line);background:var(--panel);border-radius:6px;width:26px;height:26px;font-size:13px;line-height:1;padding:0}
.ins{display:block;width:calc(100% - 48px);margin:0 0 0 48px;height:12px;border:0;background:none;position:relative;padding:0;font-size:0}
.ins::after{content:"+ Add step here";position:absolute;left:0;top:50%;transform:translateY(-50%);font-size:11.5px;font-weight:600;color:var(--accent);background:var(--panel);padding:0 6px;opacity:0;transition:opacity .12s}
.ins::before{content:"";position:absolute;left:0;right:0;top:50%;border-top:1.5px dashed var(--accent);opacity:0;transition:opacity .12s}
.ins:hover::after,.ins:hover::before,.ins:focus-visible::after,.ins:focus-visible::before,.ins.drop::before,.ins.drop::after{opacity:1}
.addend{margin:10px 0 0 48px}
.emptyflow{margin:14px 0 0 48px;padding:18px;border:1.5px dashed var(--line);border-radius:10px;color:var(--muted)}
.endcap{display:flex;align-items:center;gap:10px;padding:14px 0 0 0}
.endcap::before{content:"";width:16px;height:16px;margin-left:12px;border-radius:50%;background:var(--ink);position:relative;z-index:1;flex:none}
.endcap span{font-family:var(--f-display);font-stretch:80%;font-weight:750;letter-spacing:.07em;text-transform:uppercase;font-size:13px;margin-left:8px}

/* inspector */
.insp{background:var(--panel);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.ih{display:flex;gap:10px;align-items:flex-start;padding:16px 18px 10px;border-bottom:1px solid var(--line)}
.ih h2{margin:2px 0 0;font-family:var(--f-display);font-stretch:85%;font-weight:750;font-size:20px;line-height:1.15;text-wrap:balance}
.ih .x{margin-left:auto;background:none;border:0;font-size:22px;line-height:1;color:var(--muted);padding:0 4px}
.ib{padding:14px 18px 18px;overflow:auto;display:flex;flex-direction:column;gap:18px;min-height:0;flex:1}
.if{display:flex;gap:8px;align-items:center;padding:10px 18px;border-top:1px solid var(--line)}
.if .sp{flex:1}
.ib .intro{margin:0;color:var(--muted);font-size:13px}
.legend{display:flex;flex-direction:column;gap:10px}
.legend div{display:grid;grid-template-columns:40px 1fr;gap:10px;align-items:center;font-size:13px}
.legend b{display:block}
.legend small{color:var(--muted)}
.group{display:flex;flex-direction:column;gap:7px}
.ghd{display:flex;align-items:baseline;gap:8px}
.ghd label,.ghd h3{font-weight:700;font-size:13px;margin:0}
.ghd .cnt{font-family:var(--f-mono);font-size:11px;color:var(--accent)}
.ghd .clr{margin-left:auto;background:none;border:0;color:var(--danger);font-size:12px;padding:0}
.ghint{font-size:12px;color:var(--muted);margin:-3px 0 0}
.sec{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700;border-bottom:1px solid var(--line);padding-bottom:5px;margin:4px 0 -6px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:4px 10px;font-size:12.5px}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-wrap:wrap;align-self:flex-start}
.seg button{border:0;background:var(--panel);padding:6px 12px;font-size:12.5px;font-weight:500;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--ink);color:var(--panel)}
.checklist{border:1px solid var(--line);border-radius:8px;max-height:176px;overflow:auto}
.checklist label{display:flex;gap:9px;align-items:center;padding:7px 10px;font-size:13px;border-bottom:1px solid var(--line);cursor:pointer}
.checklist label:last-child{border-bottom:0}
.checklist label:hover{background:var(--panel-2)}
.checklist small{font-family:var(--f-mono);color:var(--muted);font-size:11px;margin-left:auto;white-space:nowrap}
.note{font-size:12px;color:var(--muted);background:var(--panel-2);border-radius:8px;padding:8px 10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld > span{font-size:12px;color:var(--muted);font-weight:600}
.cats{display:flex;gap:5px;flex-wrap:wrap}
.cats .chip{padding:3px 9px;font-size:11.5px}
.slist{border:1px solid var(--line);border-radius:8px;max-height:230px;overflow:auto}
.srow{display:grid;grid-template-columns:18px 30px 1fr;gap:8px;align-items:center;padding:6px 10px;border-bottom:1px solid var(--line);cursor:pointer;font-size:12.5px}
.srow:last-child{border-bottom:0}
.srow:hover{background:var(--panel-2)}
.srow.on{background:var(--accent-soft)}
.srow .id{font-family:var(--f-mono);font-size:10.5px;color:var(--muted)}
.srow em{grid-column:3;font-style:normal;font-size:10.5px;color:var(--warn);margin-top:-3px}
.brows{display:flex;flex-direction:column;gap:6px}
.brow{display:grid;grid-template-columns:18px minmax(0,1.6fr) minmax(0,1fr) 28px;gap:6px;align-items:center}
.brow .n{font-family:var(--f-mono);font-size:11px;color:var(--danger)}
.brow button{border:1px solid var(--line);background:var(--panel);border-radius:6px;height:30px;padding:0}
.bend{font-size:12px;color:var(--muted);font-style:italic;padding-left:24px}

.scrim{position:fixed;inset:0;background:rgba(8,14,12,.5);display:grid;place-items:center;z-index:50;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal{background:var(--panel);border-radius:14px;width:min(680px,100%);max-height:100%;display:flex;flex-direction:column;min-height:0;box-shadow:0 24px 70px rgba(0,0,0,.35)}
pre.json{margin:0;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:12px;font-family:var(--f-mono);font-size:11.5px;max-height:55vh;overflow:auto;white-space:pre}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--panel);padding:9px 16px;border-radius:8px;font-size:13px;z-index:60}

@media (max-width:1180px){
  .shell{grid-template-columns:240px minmax(0,1fr)}
  .insp{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);border-radius:0;z-index:40;transform:translateX(105%);transition:transform .2s;box-shadow:-12px 0 40px rgba(0,0,0,.25);
    padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
  .insp.open{transform:none}
}
@media (max-width:820px){
  html,body{height:auto}
  .shell{grid-template-columns:minmax(0,1fr);height:auto}
  .lib{max-height:300px}
  .flow{overflow:visible}
  .flow-in{padding:16px 14px 30px}
  .grid2{grid-template-columns:1fr}
  .step{grid-template-columns:40px minmax(0,1fr) auto}
  .ops{display:none}
  .top .name{font-size:21px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="shell">
  <aside class="rail" aria-label="Order routes and status library">
    <div class="brand">Order Routes<small>Build the journey an order takes</small></div>
    <div>
      <p class="lbl" style="padding:0 10px 6px">Routes</p>
      <div class="wflist" id="wflist"></div>
      <button class="linkbtn" id="btn-new">+ New order route</button>
    </div>
    <div class="lib">
      <div class="hd">
        <p class="lbl" id="lib-title">Status library</p>
        <p>Click to add after the selected step, or drag into the timeline.</p>
        <input type="search" id="lib-q" placeholder="Search status or ID" aria-label="Search status library">
      </div>
      <div class="mlist" id="mlist"></div>
    </div>
  </aside>

  <main class="flow">
    <div class="flow-in">
      <div class="top">
        <input type="text" class="name" id="wf-name" aria-label="Order route name">
        <select id="wf-status" aria-label="Order route status"><option>Active</option><option>Draft</option><option>Inactive</option></select>
        <select id="wf-type" aria-label="Status master type"><option value="1">Type 1 · Sales Order</option><option value="2">Type 2 · Inward</option></select>
        <button class="btn" id="btn-json">Export JSON</button>
        <button class="btn primary" id="btn-save">Save</button>
      </div>
      <div class="stats" id="stats"></div>
      <section class="rules" id="rules" tabindex="0" aria-label="Start rules"></section>
      <ol class="timeline" id="timeline"></ol>
    </div>
  </main>

  <aside class="insp" id="insp" aria-label="Inspector"></aside>
</div>

<div class="scrim" id="scrim" hidden><div class="modal" role="dialog" aria-modal="true" id="modal"></div></div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
/* ---------- Status master (from your table) ---------- */
const STATUSES = [
[1,'ORDER RECEIVED',1],[2,'PROFORMA GENERATED',1],[3,'PROFORMA CONFIRMED',1],[4,'MOVED TO PRODUCTION',1],[5,'DISPATCHED',1],[6,'CANCELLED',1],

[11,'WAITING FOR PAYMENT RECEIVED',1],[12,'WAITING FOR INVOICE RE-PREPARE',1],[13,'WAITING FOR GST INVOICE PREPARE',1],[14,'REQUEST FOR ORDER MASTER DETAILS REVISE',1],

function category(t,type){
  if(type===2) return 'Inward';
  const has=(...k)=>k.some(x=>t.includes(x));
  if(has('CANCEL')) return 'Cancellation';
  if(t.startsWith('REQUEST FOR')||has('REVISION','CHANGES','RE-PREPARE','SUBSTITUTION')) return 'Revisions';
  if(has('STENCIL','PDI')) return 'Stencil & PDI';
  if(has('PROFORMA','DRAFT PI')) return 'Proforma';
  if(has('INVOICE','PAYMENT','TCS')) return 'Invoice & Payment';
  if(has('PRODUCTION','PPC','WORK ORDER','SCHEDULE','APPROVAL')) return 'Production';
  if(has('DISPATCH','VEHICLE','SAILING','CONTAINER','DOCUMENT','SHIPPING','LOADING')) return 'Dispatch & Shipping';
  return 'Order';
}

function ruleTokens(r){
  const t=[];
  RGROUPS.forEach(g=>{if(!g.key)return;const v=r[g.key];
    if(g.kind==='seg'){if(v&&v!=='Any')t.push([g.label,v]);return}
    if(v&&v.length)t.push([g.label+(v.length>1?' is one of':' is'),v.slice(0,2).join(', ')+(v.length>2?` +${v.length-2}`:'')])});
  return t;
}

}
function phases(steps){const out=[];steps.forEach((s,i)=>{const c=byId(s.statusId)?.cat||'Unsorted';const l=out[out.length-1];l&&l.cat===c?l.items.push([s,i]):out.push({cat:c,items:[[s,i]]})});return out}

     <div class="group"><div class="ghd"><h3>Owner</h3></div>
       <div class="grid2">
         <label class="fld"><span>Assignee type</span><select id="i-atype">${['Internal User','Service Provider','Customer'].map(o=>`<option ${s.atype===o?'selected':''}>${o}</option>`).join('')}</select></label>
         <label class="fld"><span>Assignment</span><select id="i-amode">${['Direct','Round Robin'].map(o=>`<option ${s.amode===o?'selected':''}>${o}</option>`).join('')}</select></label>
         <label class="fld"><span>Person or team</span><input type="text" id="i-who" value="${esc(s.assignee)}" placeholder="e.g. CRM desk"></label>
         <label class="fld"><span>SLA (hours)</span><input type="number" id="i-sla" min="0" value="${esc(s.sla)}" placeholder="e.g. 24"></label>
       </div></div>
     ${s.kind==='approval'?`<div class="group"><div class="ghd"><h3>When sent back</h3></div>
       <p class="ghint" style="margin:0">The order goes through these steps, then returns to this approval. Leave empty to return to the previous step.</p>
       <div class="brows">${(s.back||[]).map((b,j)=>`<div class="brow"><span class="n">${j+1}</span><select data-b-status="${j}" aria-label="Send-back status ${j+1}">${statusOptions(b.statusId)}</select><input type="text" data-b-who="${j}" value="${esc(b.assignee)}" placeholder="Owner" aria-label="Send-back owner ${j+1}"><button type="button" data-b-rm="${j}" aria-label="Remove">×</button></div>`).join('')}
       ${(s.back||[]).length?'<div class="bend">↩ back to this approval</div>':''}</div>
       <button type="button" class="linkbtn" style="padding-left:0" data-b-add>+ Add send-back step</button></div>`:''}
   </div>
   <div class="if"><button class="btn" id="i-dup">Duplicate</button><span class="sp"></span><button class="btn danger" id="i-del">Delete step</button></div>`;
}

/* ---------- Inspector events ---------- */
const insp=$('#insp');
insp.addEventListener('click',e=>{
  const t=e.target;
  if(t.closest('[data-close-insp]')){sel=null;renderRules();renderTimeline();renderInspector();return}
  if(sel==='rules'){
    const r=wf().rules;
    const c=t.closest('[data-chip]');
    if(c){const a=r[c.dataset.chip],v=c.dataset.v,i=a.indexOf(v);i<0?a.push(v):a.splice(i,1);c.classList.toggle('on');c.setAttribute('aria-pressed',i<0);$('#c-'+c.dataset.chip).textContent=rcount(r,c.dataset.chip);renderRules();return}
    const sg=t.closest('[data-seg]');
    if(sg){r[sg.dataset.seg]=sg.dataset.v;sg.parentElement.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===sg));const cn=$('#c-'+sg.dataset.seg);if(cn)cn.textContent=rcount(r,sg.dataset.seg);renderRules();return}
    const x=t.closest('[data-clear]');
    if(x){const k=x.dataset.clear;r[k]=Array.isArray(r[k])?[]:'Any';$('#g-'+k).outerHTML=ruleGroup(RGROUPS.find(g=>g.key===k),r);renderRules();return}
    if(t.id==='r-reset'){Object.assign(r,emptyRules(),{matchMode:r.matchMode});renderRules();renderInspector();toast('All start rules cleared');return}
    return;
  }
  const s=findStep(sel);if(!s)return;
  const k=t.closest('[data-kind]');
  if(k){s.kind=k.dataset.kind;if(s.kind==='approval'&&!s.back)s.back=[];refreshFlow();renderInspector();return}
  const c=t.closest('[data-cat]');
  if(c){pick.cat=c.dataset.cat;c.parentElement.querySelectorAll('.chip').forEach(b=>b.classList.toggle('on',b===c));$('#i-list').innerHTML=pickList(s);return}
  const rm=t.closest('[data-b-rm]');
  if(rm){s.back.splice(+rm.dataset.bRm,1);refreshFlow();renderLib();renderInspector();return}
  if(t.closest('[data-b-add]')){s.back.push(bk(null,''));renderInspector();refreshFlow();return}
  if(t.id==='i-dup'){const i=wf().steps.indexOf(s),cp={...clone(s),id:uid('s')};if(cp.back)cp.back=cp.back.map(b=>({...b,id:uid('b')}));wf().steps.splice(i+1,0,cp);sel=cp.id;refreshFlow();renderInspector();toast('Step duplicated');return}
  if(t.id==='i-del'){if(!t.dataset.armed){t.dataset.armed='1';t.textContent='Click again to delete';return}
    const w=wf();w.steps=w.steps.filter(x=>x.id!==s.id);sel=null;refreshFlow();renderLib();renderInspector();toast('Step deleted')}
});
insp.addEventListener('change',e=>{
  const t=e.target;
  if(sel==='rules'){const cb=t.closest('input[data-key]');if(!cb)return;const r=wf().rules,a=r[cb.dataset.key],i=a.indexOf(cb.value);
    cb.checked?(i<0&&a.push(cb.value)):(i>=0&&a.splice(i,1));$('#c-'+cb.dataset.key).textContent=rcount(r,cb.dataset.key);renderRules();return}
  const s=findStep(sel);if(!s)return;
  if(t.name==='i-status'){s.statusId=+t.value;$('#i-list').querySelectorAll('.srow').forEach(r=>r.classList.toggle('on',r.querySelector('input').checked));
    $('#i-title').textContent=stepTitle(s);$('#i-name').placeholder=nice(byId(s.statusId).text);refreshFlow();renderLib();return}
  if(t.id==='i-atype'){s.atype=t.value;refreshFlow();return}
  if(t.id==='i-amode'){s.amode=t.value;refreshFlow();return}
  if(t.dataset.bStatus!=null){s.back[+t.dataset.bStatus].statusId=t.value?+t.value:null;refreshFlow();renderLib();return}
});
insp.addEventListener('input',e=>{
  const t=e.target;
  if(sel==='rules'){const sr=t.closest('[data-search]');if(!sr)return;const q=sr.value.trim().toLowerCase();sr.nextElementSibling.querySelectorAll('label').forEach(l=>l.hidden=!!q&&!l.dataset.row.includes(q));return}
  const s=findStep(sel);if(!s)return;
  if(t.id==='i-q'){pick.q=t.value.trim();$('#i-list').innerHTML=pickList(s);return}
  if(t.id==='i-name'){s.name=t.value;$('#i-title').textContent=stepTitle(s);refreshFlow();return}
  if(t.id==='i-who'){s.assignee=t.value;refreshFlow();return}
  if(t.id==='i-sla'){s.sla=t.value===''?'':Math.max(0,+t.value);refreshFlow();return}
  if(t.dataset.bWho!=null){s.back[+t.dataset.bWho].assignee=t.value;return}
});

/* ---------- Timeline events ---------- */
function select(id){sel=id;renderRules();renderTimeline();renderInspector()}
function insertStep(at,statusId){
  const w=wf(),s=mk('waypoint',statusId);w.steps.splice(at,0,s);pick.q='';
  sel=s.id;refreshFlow();renderLib();renderInspector();
  toast(statusId?`Added “${stepTitle(s)}” as step ${at+1}`:`New step ${at+1}: choose its status`);
  requestAnimationFrame(()=>document.querySelector(`[data-step="${s.id}"]`)?.scrollIntoView({block:'nearest',behavior:'smooth'}));
}
function moveStep(id,to){const w=wf(),i=w.steps.findIndex(s=>s.id===id);if(i<0)return;const [s]=w.steps.splice(i,1);to=Math.max(0,Math.min(w.steps.length,to>i?to-1:to));w.steps.splice(to,0,s);refreshFlow();if(sel===id)renderInspector()}
const tl=$('#timeline');
tl.addEventListener('click',e=>{
  const mv=e.target.closest('[data-move]');
  if(mv){const id=mv.closest('.step').dataset.step,i=+mv.closest('.step').dataset.i,d=+mv.dataset.move;moveStep(id,d<0?i-1:i+2);return}
  const ins=e.target.closest('[data-ins]');
  if(ins){insertStep(+ins.dataset.ins,null);return}
  const st=e.target.closest('.step');if(st)select(st.dataset.step);
});
tl.addEventListener('keydown',e=>{const st=e.target.closest('.step');if(st&&e.target===st&&(e.key==='Enter'||e.key===' ')){e.preventDefault();select(st.dataset.step)}});
let dragId=null;
tl.addEventListener('dragstart',e=>{const st=e.target.closest('.step');if(!st)return;dragId=st.dataset.step;e.dataTransfer.setData('text/plain','step:'+dragId);e.dataTransfer.effectAllowed='move'});
function clearDrop(){tl.querySelectorAll('.drop-before,.drop-after,.drop').forEach(x=>x.classList.remove('drop-before','drop-after','drop'))}
function dropTarget(e){
  const st=e.target.closest('.step');
  if(st){const r=st.getBoundingClientRect(),after=e.clientY>r.top+r.height/2;return {el:st,cls:after?'drop-after':'drop-before',at:+st.dataset.i+(after?1:0)}}
  const ins=e.target.closest('[data-ins]');if(ins)return {el:ins,cls:'drop',at:+ins.dataset.ins};
  return null;
}
tl.addEventListener('dragover',e=>{const d=dropTarget(e);if(!d)return;e.preventDefault();clearDrop();d.el.classList.add(d.cls)});
tl.addEventListener('dragleave',e=>{if(!tl.contains(e.relatedTarget))clearDrop()});
tl.addEventListener('drop',e=>{
  const d=dropTarget(e);clearDrop();if(!d)return;e.preventDefault();
  const v=e.dataTransfer.getData('text/plain');
  if(v.startsWith('step:'))moveStep(v.slice(5),d.at);
  else if(v.startsWith('status:'))insertStep(d.at,+v.slice(7));
});
tl.addEventListener('dragend',()=>{dragId=null;clearDrop()});

/* ---------- Start card, rail, top bar ---------- */
$('#rules').addEventListener('click',e=>{
  if(e.target.closest('[data-mm]')){const r=wf().rules;r.matchMode=r.matchMode==='All'?'Any':'All';renderRules();if(sel==='rules')renderInspector();return}
  select('rules');
});
$('#rules').addEventListener('keydown',e=>{if(e.target.id==='rules'&&(e.key==='Enter'||e.key===' ')){e.preventDefault();select('rules')}});
$('.rail').addEventListener('click',e=>{
  const w=e.target.closest('[data-wf]');
  if(w){state.current=w.dataset.wf;sel=null;pick.q='';pick.cat='All';renderAll();return}
  const s=e.target.closest('[data-add-status]');
  if(s){const steps=wf().steps,i=steps.findIndex(x=>x.id===sel);insertStep(i>=0?i+1:steps.length,+s.dataset.addStatus)}
});
$('#mlist').addEventListener('dragstart',e=>{const s=e.target.closest('[data-add-status]');if(s){e.dataTransfer.setData('text/plain','status:'+s.dataset.addStatus);e.dataTransfer.effectAllowed='copy'}});
$('#lib-q').addEventListener('input',renderLib);
$('#btn-new').addEventListener('click',()=>{
  const w={id:uid('w'),name:'New order route',status:'Draft',statusType:1,rules:emptyRules(),steps:[]};
  state.workflows.push(w);state.current=w.id;sel='rules';renderAll();$('#wf-name').select();
});
$('#wf-name').addEventListener('input',e=>{wf().name=e.target.value;renderWfList()});
$('#wf-status').addEventListener('change',e=>{wf().status=e.target.value;renderWfList()});
$('#wf-type').addEventListener('change',e=>{wf().statusType=+e.target.value;pick.cat='All';renderLib();renderWfList();renderInspector();toast(`Library now shows Type ${e.target.value} · ${TYPES[e.target.value]} statuses`)});
$('#btn-save').addEventListener('click',()=>toast(persist()?'Saved in this browser':'Could not save: browser storage is blocked'));
document.addEventListener('keydown',e=>{
  if(!$('#scrim').hidden){if(e.key==='Escape')closeModal();return}
  if(e.key==='Escape'&&sel){sel=null;renderRules();renderTimeline();renderInspector()}
});

/* ---------- Export JSON ---------- */
function exportDef(){
  const w=wf(),steps=[],links=[];
  const out=(s,extra={})=>({id:s.id,kind:s.kind||'task',statusId:s.statusId,statusText:byId(s.statusId)?.text??null,name:s.kind?stepTitle(s):(byId(s.statusId)?nice(byId(s.statusId).text):null),assigneeType:s.atype||'Internal User',assignment:s.amode||'Direct',assignee:s.assignee||'',slaHours:s.sla===''||s.sla==null?null:+s.sla,...extra});
  if(w.steps[0])links.push({from:'start',to:w.steps[0].id,path:'next'});
  w.steps.forEach((s,i)=>{
    steps.push(out(s,{order:i+1}));const next=w.steps[i+1];
    if(next)links.push({from:s.id,to:next.id,path:s.kind==='approval'?'approve':'next'});
    if(s.kind==='approval'){const b=s.back||[];
      if(b.length){b.forEach((x,j)=>{steps.push(out(x,{sendBackOf:s.id}));links.push({from:j?b[j-1].id:s.id,to:x.id,path:j?'next':'reject'})});links.push({from:b[b.length-1].id,to:s.id,path:'next'})}
      else if(i>0)links.push({from:s.id,to:w.steps[i-1].id,path:'reject'});}
  });
  return {name:w.name,status:w.status,statusTypeId:w.statusType,startRules:w.rules,steps,links};
}
function openModal(h){$('#modal').innerHTML=h;$('#scrim').hidden=false}
function closeModal(){$('#scrim').hidden=true;$('#modal').innerHTML=''}
$('#scrim').addEventListener('click',e=>{if(e.target.id==='scrim'||e.target.closest('[data-close]'))closeModal()});
$('#btn-json').addEventListener('click',()=>{
  const json=JSON.stringify(exportDef(),null,2);
  openModal(`<div class="ih"><div><p class="lbl">Export</p><h2>Order route JSON</h2></div><button class="x" data-close aria-label="Close">×</button></div>
   <div class="ib"><p class="intro">Definition for “${esc(wf().name)}”: start rules, steps with status IDs, and links (next, approve, reject).</p><pre class="json" id="json-pre">${esc(json)}</pre></div>
   <div class="if"><span class="sp"></span><button class="btn" data-close>Close</button><button class="btn primary" id="copy-json">Copy JSON</button></div>`);
  $('#copy-json').onclick=()=>navigator.clipboard.writeText(json).then(()=>toast('Copied')).catch(()=>{const r=document.createRange();r.selectNodeContents($('#json-pre'));const s=getSelection();s.removeAllRanges();s.addRange(r);toast('Selected: press Ctrl+C to copy')});
});

/* ---------- Boot ---------- */
load();renderAll();
</script>
