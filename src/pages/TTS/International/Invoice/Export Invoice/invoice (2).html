<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Shipping Scheme Split</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f8f9fa; }
    .container { background: #fff; padding: 20px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
  </style>
</head>
<body class="p-4">
  <div class="container">
    <h4 class="mb-4">📦 Scheme-wise Shipping Invoice Preparation</h4>

    <!-- Header -->
    <form class="row g-3 mb-4">
      <div class="col-md-4">
        <label class="form-label">PO Number</label>
        <input type="text" class="form-control" value="PO/EXP/2025/0056" readonly />
      </div>
      <div class="col-md-4">
        <label class="form-label">Dispatch Date</label>
        <input type="date" class="form-control" value="2025-07-02" />
      </div>
      <div class="col-md-4">
        <label class="form-label">Consignee</label>
        <input type="text" class="form-control" value="ABC EXPORTS LTD, USA" readonly />
      </div>

      <div class="col-md-4">
        <label class="form-label">Apply Scheme to All Rows</label>
        <select class="form-select" id="applyAllScheme" onchange="applySchemeToAll()">
          <option value="">-- Select Scheme --</option>
          <option value="Advance License">Advance License</option>
          <option value="Duty Drawback">Duty Drawback</option>
          <option value="Mowr">MOOWR</option>
        </select>
      </div>
    </form>

    <!-- Table -->
    <table class="table table-bordered align-middle">
      <thead class="table-light">
        <tr>
          <th>#</th>
          <th>Part No</th>
          <th>Description</th>
          <th>Total PO Qty</th>
          <th>Split Qty</th>
          <th>Remaining Qty</th>
          <th>Scheme</th>
          <th>Remarks</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="schemeTableBody"></tbody>
    </table>

    <!-- Buttons -->
    <div class="d-flex justify-content-between">
      <button class="btn btn-outline-primary" onclick="addEmptyRow()">➕ Add New Row</button>
      <div>
        <button class="btn btn-warning" onclick="validateQty()">🧮 Validate Splits</button>
        <button class="btn btn-success">💾 Save Assignments</button>
        <button class="btn btn-primary">🧾 Generate Invoices</button>
      </div>
    </div>
  </div>

  <!-- JavaScript -->
  <script>
    let rowCount = 0;
    const poItems = [
      { partNo: "TY001", description: "Truck Tyre 24x12", qty: 109 },
      { partNo: "TY002", description: "Scooter Tyre", qty: 20 }
    ];

    function loadPOItems() {
      poItems.forEach(item => {
        addRow(item.partNo, item.description, item.qty, item.qty);
      });
    }

    function addRow(partNo = "", description = "", totalQty = "", splitQty = "") {
      rowCount++;
      const table = document.getElementById("schemeTableBody");
      const row = document.createElement("tr");

      row.innerHTML = `
        <td>${rowCount}</td>
        <td><input class="form-control part-no" value="${partNo}" readonly /></td>
        <td><input class="form-control description" value="${description}" readonly /></td>
        <td><input class="form-control total-po" value="${totalQty}" readonly /></td>
        <td><input class="form-control split-qty" value="${splitQty}" oninput="validateQty()" /></td>
        <td><input class="form-control remaining-qty" value="" readonly /></td>
        <td>
          <select class="form-select scheme-select">
            <option value="">-- Select --</option>
            <option value="Advance License">Advance License</option>
            <option value="Duty Drawback">Duty Drawback</option>
            <option value="Mowr">Mowr</option>
          </select>
        </td>
        <td><input class="form-control" placeholder="Remarks" /></td>
        <td>
          <button class="btn btn-sm btn-secondary" onclick="splitRow(this)">🔀 Split</button>
          <button class="btn btn-sm btn-danger" onclick="removeRow(this)">🗑️</button>
        </td>
      `;

      table.appendChild(row);
      updateRemainingQty();
    }

    function splitRow(button) {
      const currentRow = button.closest("tr");
      const partNo = currentRow.querySelector(".part-no").value;
      const description = currentRow.querySelector(".description").value;
      const totalQty = currentRow.querySelector(".total-po").value;

      addRow(partNo, description, totalQty, 0);
    }

    function addEmptyRow() {
      addRow("", "", "", "");
    }

    function removeRow(button) {
      const row = button.closest("tr");
      row.remove();
      updateRowNumbers();
      validateQty();
    }

    function updateRowNumbers() {
      const rows = document.querySelectorAll("#schemeTableBody tr");
      rowCount = 0;
      rows.forEach(row => {
        row.cells[0].innerText = ++rowCount;
      });
    }

    function validateQty() {
      const rows = document.querySelectorAll("#schemeTableBody tr");
      const partTotals = {};

      rows.forEach(row => {
        const partNo = row.querySelector(".part-no").value;
        const qty = parseFloat(row.querySelector(".split-qty").value || "0");
        if (!partNo) return;
        if (!partTotals[partNo]) partTotals[partNo] = 0;
        partTotals[partNo] += qty;
      });

      let valid = true;
      poItems.forEach(item => {
        const total = partTotals[item.partNo] || 0;
        if (total > item.qty) {
          alert(`❌ Split quantity for ${item.partNo} exceeds PO quantity (${total} > ${item.qty})`);
          valid = false;
        }
      });

      updateRemainingQty();
      return valid;
    }

    function updateRemainingQty() {
      const rows = document.querySelectorAll("#schemeTableBody tr");
      const partTotals = {};

      // Recalculate total split qty for each part
      rows.forEach(row => {
        const partNo = row.querySelector(".part-no").value;
        const qty = parseFloat(row.querySelector(".split-qty").value || "0");
        if (!partNo) return;
        if (!partTotals[partNo]) partTotals[partNo] = 0;
        partTotals[partNo] += qty;
      });

      // Update remaining column
      rows.forEach(row => {
        const partNo = row.querySelector(".part-no").value;
        const totalPO = poItems.find(p => p.partNo === partNo)?.qty || 0;
        const usedQty = partTotals[partNo] || 0;
        const remainingInput = row.querySelector(".remaining-qty");
        remainingInput.value = totalPO - usedQty;
      });
    }

    function applySchemeToAll() {
      const scheme = document.getElementById("applyAllScheme").value;
      const selects = document.querySelectorAll(".scheme-select");
      selects.forEach(select => {
        select.value = scheme;
      });
    }

    window.onload = () => {
      loadPOItems();
    };
  </script>
</body>
</html>
