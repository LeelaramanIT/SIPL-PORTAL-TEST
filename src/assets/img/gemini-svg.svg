  </g>

  <rect x="1100" y="200" width="200" height="12" rx="6" fill="#EEF2F6"/>
  <rect x="1100" y="230" width="150" height="12" rx="6" fill="#EEF2F6"/>
  <rect x="1100" y="260" width="180" height="12" rx="6" fill="#EEF2F6"/>
